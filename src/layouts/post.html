<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title><%= title %></title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b5bf0'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-in">
        <a class="brand" href="." aria-label="Personal blog, all posts">
          <span class="orb" aria-hidden="true"><span class="orb-core"></span></span>
          <span class="who">
            <span class="wordmark">personal <span class="only">blog</span></span>
            <span class="tagline">sharing thoughts</span>
          </span>
        </a>
      </div>
    </header>

    <main class="post">
      <article>
        <header class="post-head">
          <h1><%= title %></h1>
          <% if (locals.subtitle) { %><p class="sub"><%= subtitle %></p><% } %>
        </header>
        <div class="prose">
          <%- content %>
        </div>
      </article>
      <a class="back" href=".">All posts</a>
    </main>
  </body>
</html>
